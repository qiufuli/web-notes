<body>
  <script>
    // 1、let 只在当前的代码块有意义 有自己的作用域
    // {
    //   let a = 1;
    //   var b = 2;
    // }
    // console.log('b',b); // 2
    // console.log('a',a); // a is not defined

    //============================================

    // 2、 不存在变量提升
    // console.log('c', c); // ReferenceError: Cannot access 'c' before initialization
    // let c = 1;

    //============================================

    //3、暂时性死区  只要块级作用域内存在let命令，它所声明的变量就“绑定”（binding）这个区域，不再受外部的影响
    //let所在的代码块 如果有同名变量 会绑定到let的作用域中 不受外部影响
    //“暂时性死区”也意味着typeof不再是一个百分之百安全的操作。
    // var tmp = 123;

    // if (true) {
    //   tmp = 'abc'; // ReferenceError: Cannot access 'tmp' before initialization
    //   let tmp;
    // }

    //============================================


    // 4、不允许在相同作用域中重复声明 （var const声明的也不行）
    // 报错
    // function func() {
    //   let a = 10;
    //   var a = 1;
    // }

    // // 报错
    // function func() {
    //   let a = 10;
    //   const a = 1;
    // }

    // // 报错
    // function func() {
    //   let a = 10;
    //   let a = 1;
    // }
    // 因此，不能在函数内部重新声明参数 (定义重名参数是不行的)))

    function func(arg) {
      let arg = 1;
    }
    func() // 报错

  </script>
