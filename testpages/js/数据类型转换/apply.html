<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <!-- <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.9/browser.min.js"></script> -->
  <script>
    /**
     * apply(obj,[xx,yy,zz])
     * 可以改变this的执行，并且立即执行
     * 
     * **/

    var myName = '123';
    var obj = {
      myName: 'abc'
    }

    function fn1(age, sex) {
      console.log(this.myName, age, sex)
    }
    fn1(10, '男'); //123 10 男
    fn1.apply(obj, [20, '女']) //abc 20 女

    // 实现
    Function.prototype.myApply = function (context) {
      console.log('this context', this, context);
      context = context ? context : window
      // 这样调用fn的时候就是context调用的改变了this指向 this指向context也就是obj
      context.fn = this;
      var result = context.fn(...arguments[1])
      delete context.fn
      return result
    }

    fn1.myApply(obj, [30, '男']) // abc 30 男
  </script>
</body>

</html>
