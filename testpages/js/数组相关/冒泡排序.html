    <script>

        function mp(arr){
            var temp =0;
            for(var i=0;i<arr.length;i++){
                for(var j=i+1;j<arr.length;j++){
                    if(arr[i]>arr[j]){
                        temp = arr[i];
                        arr[i] = arr[j];
                        arr[j] = temp
                    }
                }
            }
            console.log(arr);
        }
        mp([3,2,5,9,1,6,33,4,65,22])
    </script>
