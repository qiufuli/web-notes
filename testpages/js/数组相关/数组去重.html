<body>
    <script>
        function unique(arr){
            var res = [],obj={};
            for(var i=0;i<arr.length;i++){
                if(!obj[arr[i]]){
                    obj[arr[i]] = 1;
                    res.push(i);
                }
            }
            return res;
        }

        function unique2(arr){
            var res = [];
            for(var i=0;i<arr.length;i++){
                if(res.indexOf(arr[i]) == -1){
                    res.push(arr[i])
                }
            }
            return res;
        }

    </script>
</body>
