<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>
  <style>
    .box{
      width: 100px;
      height: 100px;
      background: lightblue;
      position: sticky;
      top: 50px;
    }
    .wrap{
      width: 100%;
      height: 1000px;
      border: 1px solid;
    }
    /* 
    sticky 粘性定位 

    相当于relative和fixed的结合，它的行为就像 position:relative; 而当页面滚动超出目标区域时，它的表现就像 position:fixed;，它会固定在目标位置。
    
	- 必须指定top、bottom、left、right4个值之一，否则只会处于相对定位
	- 父元素的高度不能低于sticky元素的高度
	- sticky元素仅在其父元素内生效 ，滚动超过父元素就会变成relative
  - 父元素不能overflow:hidden或者overflow:auto属性。
    */

  </style>
</head>
<body>
  <!-- sticky 粘性定位 -->
  <p>asdjkasdhkj</p>
  <p>asdjkasdhkj</p>
  <p>asdjkasdhkj</p>
  <p>asdjkasdhkj</p>
  <p>asdjkasdhkj</p>
  <p>asdjkasdhkj</p>
  <p>asdjkasdhkj</p>
  <p>asdjkasdhkj</p>
  <div class="wrap">
      <div class="box"></div>
    
  </div>
</body>
</html>
