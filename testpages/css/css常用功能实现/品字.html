<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    .container {
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      width: 100%;
      height: 100%;
    }

    .firstRow,
    .firstRow,
    .secondRow {
      width: 100%;
      height: 30%;
      display: flex;
      flex-direction: row;
      justify-content: center;
      margin: 10px 0;
    }

    .item {
      background-color: red;
      width: 40%;
      height: 100%;
      margin: 0 auto;
      border-radius: 10%;
    }
  </style>
</head>

<body>
  <article class="container">
    <div class="firstRow">
      <div class="item"></div>
    </div>
    <div class="secondRow">
      <div class="item"></div>
      <div class="item"></div>
    </div>
  </article>
</body>

</html>
